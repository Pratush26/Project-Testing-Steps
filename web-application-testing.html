<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Web Application Testing Checklist</title>
    <meta name="description" content="Interactive checklist for testing a production-grade web application." />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="assets/theme.js"></script>
    <script src="assets/checklist.js"></script>
  </head>
  <body
    class="min-h-screen bg-slate-50 text-slate-900 antialiased dark:bg-slate-900 dark:text-slate-100"
  >
    <header
      class="sticky top-0 z-10 border-b border-slate-200 bg-white/80 backdrop-blur dark:border-slate-700 dark:bg-slate-900/80"
    >
      <div class="mx-auto flex max-w-3xl items-center justify-between px-4 py-3">
        <a href="index.html" class="flex items-center gap-2 font-semibold">
          <span class="flex h-8 w-8 items-center justify-center rounded-lg bg-slate-900 text-white dark:bg-white dark:text-slate-900">⛁</span>
          <span>Project Testing Steps</span>
        </a>
        <button
          data-theme-toggle
          type="button"
          class="flex items-center gap-1.5 rounded-md border border-slate-200 px-3 py-1.5 text-sm font-medium text-slate-600 hover:bg-slate-100 dark:border-slate-700 dark:text-slate-300 dark:hover:bg-slate-800"
        >
          <span data-theme-icon>🌙</span><span data-theme-label>Dark</span>
        </button>
      </div>
    </header>

    <main class="mx-auto max-w-3xl px-4 py-10">
      <a href="index.html" class="mb-6 inline-flex items-center gap-1 text-sm text-slate-500 hover:text-slate-700 dark:text-slate-400 dark:hover:text-slate-200">← All checklists</a>

      <h1 id="checklist-title" class="mb-2 text-2xl font-bold tracking-tight sm:text-3xl">
        Web Application Testing Checklist
      </h1>
      <p class="mb-6 text-slate-600 dark:text-slate-300">
        Tap an item to mark it done. Progress is shown below and resets when you
        reload the page. This list extends the website checklist with
        application-specific checks.
      </p>

      <div class="mb-6 rounded-xl border border-slate-200 bg-white p-4 dark:border-slate-700 dark:bg-slate-800">
        <div class="mb-2 flex items-center justify-between">
          <span id="progress-text" class="text-sm font-medium text-slate-600 dark:text-slate-300">Completed 0 of 0</span>
          <button
            id="reset-btn"
            type="button"
            class="rounded-md border border-slate-200 px-3 py-1 text-xs font-medium text-slate-600 hover:bg-slate-100 dark:border-slate-700 dark:text-slate-300 dark:hover:bg-slate-700"
          >
            Reset
          </button>
        </div>
        <div class="h-2 w-full overflow-hidden rounded-full bg-slate-100 dark:bg-slate-700">
          <div id="progress-bar" class="h-full rounded-full bg-emerald-500 transition-all duration-300" style="width: 0%"></div>
        </div>
      </div>

      <div id="checklist" class="flex flex-col gap-2"></div>
    </main>

    <script type="text/markdown" id="fallback-md">
# This is a quick proto-type testing example of testing a production grade web application

1. Check images are used, properly related or not.

1. Check all links are working and redirecting the desired url
1. Maintain proper color consistancy by following color theme
1. Ensure responsiveness for all devices
1. Maintain proper space consistancy between sections
1. Check meta tag's info, canonical URL
1. Ensure all basic info are properly updated (logo, FavIcone, email, phone, email, address, social links)
1. Check proper GTM tags and Contact forms
1. Ensure all contents are relavent
1. Properly optimized the images
1. Make the overall interactivitly user friendly
1. Properly varify actions with authentication and authorization
1. Ensure proper calculations
1. Properly restrict api calls
1. Test all form submission
1. Ensure quick changes in the ui whlie any update
1. Ensure relavent toaster and alert messages
1. Add sitemap.xml, robots.txt
1. Add proper privacy policy, terms & conditions, not found and error page
1. Improve the lighthouse test result
1. Ensure proper safety of env to avoid leak or other vulnerability
1. Check build and type errors
1. Remove Unnecessary console logs
    </script>

    <script>
      ProjectChecklist.init({
        readme: "web-application-testing/README.md",
        fallback: document.getElementById("fallback-md").textContent,
        title: "#checklist-title",
        list: "#checklist",
        progress: "#progress-text",
        bar: "#progress-bar",
        reset: "#reset-btn",
      });
    </script>
  </body>
</html>
